openapi: 3.1.0
info:
  title: OMS GRASON – Kontrak ADV AI
  version: 1.0.0
  description: |
    Kontrak antara ADV AI dan OMS GRASON.

    - ID campaign, adset, dan iklan per lead **tidak** dikirim ADV AI langsung; ID itu
      dibawa lead dari SaaS CS AI (lihat `cs-ai.v1.yaml`, `POST /leads`).
    - ADV AI mengirim spend iklan harian, lalu membaca performa per iklan (lead,
      order, GMV cair, ROAS riil) dari OMS.
    - Event pembelian ke Meta Conversions API: endpoint `GET /ads/purchases` disiapkan
      untuk skenario "lewat ADV AI". Keputusan apakah OMS mengirim langsung atau lewat
      ADV AI belum diambil; endpoint ini berstatus draft.
    - **Keputusan terbuka:** kapan event Purchase dikirim. Draft memakai saat order
      Selesai (COD cair), tetapi COD sering cair lebih dari 7 hari setelah klik, melewati
      batas 7 hari Meta Conversions API. Usulan: kirim saat Terverifikasi atau Terkirim,
      lalu koreksi bila order berakhir RTS/batal. Lihat
      `docs/decisions/0002-waktu-event-purchase-meta.md`.

    Aturan umum:
    - API key sistem `adv_ai` (scope `spend_iklan.tulis`, `performa_iklan.baca`).
    - Uang = integer rupiah. Tanggal spend dan rentang laporan = tanggal WIB.
    - Idempotensi spend: `record_id` unik di ADV AI. Kiriman ulang dengan `record_id`
      sama memperbarui nilai (spend hari berjalan bisa direvisi), tidak menambah baris.
servers:
  - url: https://oms.grason.example/api/v1
    description: Produksi (alamat final menyusul)
  - url: http://localhost:3001/api/v1
    description: Lokal
security:
  - bearerApiKey: []
  - headerApiKey: []
tags:
  - name: Spend
    description: Spend iklan harian dari ADV AI.
  - name: Performa
    description: Hasil iklan menurut uang yang benar-benar masuk.
paths:
  /ad-spend/daily:
    post:
      tags: [Spend]
      operationId: kirimSpendHarian
      summary: Kirim atau revisi spend iklan harian
      description: |
        Batch 1–1000 baris. Satu baris = satu iklan pada satu tanggal. Pasangan
        (`tanggal`, `ad_id`) juga unik: baris baru dengan `record_id` berbeda untuk
        pasangan yang sama ditolak per baris (`konflik_tanggal_iklan`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    $ref: '#/components/schemas/SpendHarian'
      responses:
        '200':
          description: Batch diproses.
          content:
            application/json:
              schema:
                type: object
                required: [disimpan, diperbarui, gagal]
                properties:
                  disimpan:
                    type: integer
                  diperbarui:
                    type: integer
                  gagal:
                    type: array
                    items:
                      type: object
                      required: [record_id, error]
                      properties:
                        record_id:
                          type: string
                        error:
                          $ref: '#/components/schemas/IsiGalat'
        '400':
          $ref: '#/components/responses/ValidasiGagal'
        '401':
          $ref: '#/components/responses/TidakTerautentikasi'
        '403':
          $ref: '#/components/responses/TidakDiizinkan'
  /ads/performance:
    get:
      tags: [Performa]
      operationId: performaIklan
      summary: Lead, order, GMV cair, dan ROAS riil per iklan
      description: |
        ROAS riil = GMV cair ÷ spend. GMV cair = COD yang cair ditambah transfer yang
        diterima; order batal dan RTS tidak dihitung. Angka bisa berubah mundur saat COD
        cair belakangan, jadi tarik ulang rentang 30 hari terakhir secara berkala.
      parameters:
        - name: dari
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2026-10-01'
        - name: sampai
          in: query
          required: true
          description: Inklusif. Rentang maksimal 93 hari.
          schema:
            type: string
            format: date
            example: '2026-10-31'
        - name: level
          in: query
          schema:
            type: string
            enum: [ad, adset, campaign]
            default: ad
        - name: dasar_tanggal
          in: query
          description: '`lead` = dikelompokkan menurut tanggal lead masuk (default); `cair` = menurut tanggal COD cair.'
          schema:
            type: string
            enum: [lead, cair]
            default: lead
      responses:
        '200':
          description: Performa per baris level.
          content:
            application/json:
              schema:
                type: object
                required: [dari, sampai, level, data]
                properties:
                  dari:
                    type: string
                    format: date
                  sampai:
                    type: string
                    format: date
                  level:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PerformaIklan'
        '400':
          $ref: '#/components/responses/ValidasiGagal'
        '401':
          $ref: '#/components/responses/TidakTerautentikasi'
        '403':
          $ref: '#/components/responses/TidakDiizinkan'
  /ads/purchases:
    get:
      tags: [Performa]
      operationId: daftarPembelian
      summary: Event pembelian untuk Meta Conversions API – draft
      x-keputusan-terbuka:
        - 'Jalur event: OMS langsung ke Meta atau lewat ADV AI (docs/decisions/0001-fondasi-fase-0.md).'
        - 'Waktu event Purchase: Terverifikasi, Terkirim, atau Selesai, plus koreksi RTS (docs/decisions/0002-waktu-event-purchase-meta.md).'
      description: |
        Satu event per order dari lead yang membawa `ad_id`. Nomor WA hanya dikirim
        dalam bentuk hash SHA-256 (format Meta: angka saja, diawali kode negara).

        **Keputusan terbuka – waktu event.** Draft ini membuat event saat order Selesai
        (COD cair cocok, atau transfer terkirim). Meta Conversions API menolak event
        dengan `event_time` lebih dari 7 hari ke belakang dan memakai jendela atribusi
        7 hari setelah klik, sementara COD sering cair lebih lambat dari itu. Usulan:
        event dibuat saat Terverifikasi atau Terkirim, ditambah event koreksi bila order
        berakhir RTS atau batal. Pemicu event, arti `terjadi_at` dan `nilai`, serta
        skema koreksi menyusul setelah keputusan diambil.

        Status draft sampai jalur dan waktu event ke Meta diputuskan.
      parameters:
        - name: sejak
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: kursor
          in: query
          schema:
            type: string
        - name: batas
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        '200':
          description: Event pembelian.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventPembelian'
                  kursor_berikutnya:
                    type: [string, 'null']
        '400':
          $ref: '#/components/responses/ValidasiGagal'
        '401':
          $ref: '#/components/responses/TidakTerautentikasi'
        '403':
          $ref: '#/components/responses/TidakDiizinkan'
components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      description: 'API key OMS: `Authorization: Bearer gok_<prefix>_<secret>`'
    headerApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
  responses:
    ValidasiGagal:
      description: Data tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
    TidakTerautentikasi:
      description: API key tidak ada, salah, atau sudah dicabut.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
    TidakDiizinkan:
      description: API key tidak punya scope untuk endpoint ini.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Galat'
  schemas:
    IsiGalat:
      type: object
      required: [kode, pesan]
      properties:
        kode:
          type: string
        pesan:
          type: string
        detail: {}
    Galat:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/IsiGalat'
    Rupiah:
      type: integer
      minimum: 0
      description: Integer rupiah, tanpa desimal.
      example: 1500000
    SpendHarian:
      type: object
      required: [record_id, tanggal, campaign_id, ad_id, spend]
      properties:
        record_id:
          type: string
          maxLength: 100
          description: ID baris di ADV AI; kunci idempotensi.
        tanggal:
          type: string
          format: date
          description: Tanggal spend (WIB).
          example: '2026-10-27'
        campaign_id:
          type: string
        campaign_nama:
          type: [string, 'null']
        adset_id:
          type: [string, 'null']
        ad_id:
          type: string
        ad_nama:
          type: [string, 'null']
        sku:
          type: [string, 'null']
          description: SKU produk utama yang diiklankan, bila diketahui.
          example: VVG-01
        spend:
          $ref: '#/components/schemas/Rupiah'
    PerformaIklan:
      type: object
      required: [id, lead, order, order_terkirim, order_selesai, order_rts, gmv_cair, spend]
      properties:
        id:
          type: string
          description: '`ad_id`, `adset_id`, atau `campaign_id` sesuai `level`.'
        campaign_id:
          type: string
        adset_id:
          type: [string, 'null']
        ad_id:
          type: [string, 'null']
        lead:
          type: integer
        order:
          type: integer
          description: Order dibuat (tidak termasuk batal).
        order_terkirim:
          type: integer
        order_selesai:
          type: integer
        order_rts:
          type: integer
        gmv_cair:
          $ref: '#/components/schemas/Rupiah'
        spend:
          $ref: '#/components/schemas/Rupiah'
        roas_riil:
          type: [number, 'null']
          description: gmv_cair ÷ spend, dua desimal. null bila spend 0.
          example: 2.35
        closing_rate:
          type: [number, 'null']
          description: Lead yang jadi order ÷ total lead, 0–1.
    EventPembelian:
      type: object
      required: [event_id, order_id, ad_id, nilai, mata_uang, terjadi_at]
      properties:
        event_id:
          type: string
          description: Stabil per order; pakai sebagai `event_id` Meta untuk deduplikasi.
        order_id:
          type: string
          format: uuid
        campaign_id:
          type: [string, 'null']
        adset_id:
          type: [string, 'null']
        ad_id:
          type: string
        nilai:
          allOf:
            - $ref: '#/components/schemas/Rupiah'
          description: GMV cair order. Bisa berubah menjadi nilai order bila event dikirim sebelum COD cair (keputusan terbuka).
        mata_uang:
          type: string
          const: IDR
        terjadi_at:
          type: string
          format: date-time
          description: Waktu order Selesai (UTC). Mengikuti pemicu event yang dipilih (keputusan terbuka).
        no_wa_sha256:
          type: string
          description: SHA-256 hex dari nomor WA `628…`.
